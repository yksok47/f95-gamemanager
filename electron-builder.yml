appId: com.f95gamemanager.app
productName: F95 Game Manager
directories:
  output: dist
# Only the compiled app. package.json and production node_modules are always added.
# If every entry is an exclusion, electron-builder keeps the default **/* and packs
# local junk (.userdata, .user-scratch, .agent-scratch, docs, …) into app.asar.
files:
  - 'out/**/*'
extraResources:
  - from: resources/unren
    to: unren
    filter:
      - '**/*'
      - '!_cabs'
      - '!_cabs/**'
  - from: node_modules/7zip-bin/win
    to: 7zip/win
    filter:
      - '**/7za.exe'
asarUnpack:
  - resources/**
  - '**/node_modules/7zip-bin/**'
  - '**/7za.exe'
  - '**/node_modules/node-unrar-js/**'
  - '**/node_modules/node-datachannel/**'
win:
  executableName: F95GameManager
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
npmRebuild: false
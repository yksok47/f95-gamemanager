name: Release from changelog

on:
  push:
    branches:
      - master
    paths:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: changelog-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Find new changelog version
        id: version
        run: |
          VERSION="$(bun scripts/changelog.ts latest)"
          TAG="v$VERSION"
          echo "Latest changelog version: $TAG"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, nothing to release"
            exit 0
          fi
          HIGHEST="$(git tag -l 'v[0-9]*' | sort -V | tail -n 1)"
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "::warning::Changelog version $TAG is not newer than the latest tag $HIGHEST, skipping"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Start release build
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
